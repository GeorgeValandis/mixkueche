<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mixküche">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9faf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Mixküche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}

/* Layout: eine Spalte wie eine Koch-App – großes Bild, darüber geschobene weiße Karte, unten fixe Aktion. Kochmodus = ein Schritt pro Bildschirm. */
:root{
  --bg:#f9faf9; --surface:#ffffff; --fg:#1d211e; --muted:#6c736e; --soft:#eef1ee;
  --accent:#3d9a46; --accent-ink:#ffffff; --accent-soft:#e6f3e7; --warn:#c2571a;
  --display:"Lexend",ui-rounded,system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
  --r:20px; --shadow:0 6px 24px rgba(20,40,24,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#1c201d; --fg:#eef2ef; --muted:#9aa39c; --soft:#262b27;
  --accent:#55b45e; --accent-ink:#0d1a0f; --accent-soft:#1f3322; --warn:#f08a4b; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1c201d; --fg:#eef2ef; --muted:#9aa39c; --soft:#262b27;
  --accent:#55b45e; --accent-ink:#0d1a0f; --accent-soft:#1f3322; --warn:#f08a4b; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto}
.gutter{padding-inline:16px}

/* Start */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px 8px}
.top h1{font-size:30px}
.hero{position:relative;display:block;width:100%;text-align:left}
.photo{object-fit:cover;object-position:var(--pos,50% 40%);background:var(--soft)}
.credit{font-size:12px;color:var(--muted);padding-top:20px}
.hero canvas,.hero img{display:block;width:100%;aspect-ratio:1/1;max-width:100%}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.hero .card{position:relative;margin:-64px 16px 0;padding:20px 20px 18px}
.hero .card h2{font-size:26px;margin-bottom:22px}
.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.meta .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.sec-title{font-family:var(--display);font-size:22px;padding-block:28px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:40px}
.tile{text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile canvas,.tile img{width:100%;aspect-ratio:1/1;border-radius:16px;display:block}
.tile b{font-family:var(--display);font-weight:400;font-size:16px}
/* Karussell */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .hero{flex:0 0 100%;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:8px;padding-top:18px;height:26px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--muted);opacity:.35;transition:width .25s,opacity .25s,background .25s}
.dots i.on{width:28px;background:var(--accent);opacity:1}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding-block:28px 14px}
.row-head .sec-title{padding:0}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:6px 0}
/* Rezeptliste */
.search-bar{position:sticky;top:0;z-index:4;background:var(--bg);padding-block:10px}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--fg);height:100%}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;visibility:hidden}
.clear.on{visibility:visible}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;background:var(--soft);font-weight:500;font-size:15px;transition:background .2s,color .2s}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.count-line{color:var(--muted);font-size:14px;padding-block:12px 4px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;padding-bottom:120px}
.item{display:grid;grid-template-columns:76px 1fr 20px;gap:14px;align-items:center;padding-block:10px;text-align:left;width:100%}
.item img,.item canvas{width:76px;height:76px;border-radius:14px;object-fit:cover;display:block}
.item .t{font-family:var(--display);font-size:17px;line-height:1.25;min-width:0}
.item .meta{font-size:14px;margin-top:6px}
.item .tags{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .chev{color:var(--muted)}
.item + .item{box-shadow:0 -1px 0 var(--soft)}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:6}
.nav-in{pointer-events:auto;max-width:360px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(20,40,24,.14)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;height:56px;justify-content:center;border-radius:999px;color:var(--fg);text-decoration:none;font-size:13px;font-weight:500;transition:background .2s,color .2s}
.nav a.on{background:var(--soft);color:var(--accent)}
.nav-pad{height:110px}
.empty{padding:60px 8px;text-align:center;color:var(--muted);line-height:1.5}
.empty b{display:block;font-family:var(--display);font-weight:400;color:var(--fg);font-size:20px;margin-bottom:6px}

/* Rezept */
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:5;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.detail .card{position:relative;margin:-56px 16px 0;padding:22px 20px}
.detail h2{font-size:28px;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.facts div{background:var(--soft);border-radius:14px;padding:12px 4px}
.facts b{display:block;font-family:var(--display);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
.portions{display:flex;align-items:center;justify-content:space-between;padding-block:26px 6px}
.portions h3{font-size:22px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.stepper button:active{background:var(--surface)}
.stepper output{min-width:76px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.group{font-family:var(--display);font-size:15px;color:var(--accent);padding-block:18px 4px;letter-spacing:.02em}
.ing{display:grid;grid-template-columns:84px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--soft);line-height:1.35}
.ing:last-child{border-bottom:0}
.ing .q{font-weight:600;font-variant-numeric:tabular-nums}
.ing small{color:var(--muted);display:block}
.spacer{height:120px}
.cta-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta{display:block;width:100%;max-width:528px;margin:0 auto;height:56px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px}

/* Kochmodus */
.cook{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-head{display:flex;align-items:center;gap:12px;padding:10px 16px}
.cook-head .x{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.progress{flex:1;display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--soft)}
.progress i.on{background:var(--accent)}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.cook-body{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:18px}
.cook-body .grp{font-family:var(--display);color:var(--accent);font-size:15px}
.step-text{font-size:22px;line-height:1.45;margin:0}
.step-text b{font-weight:700}
.tm{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}
.tm div{padding:18px 6px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tm div + div{box-shadow:-1px 0 0 var(--soft)}
.tm b{font-family:var(--display);font-weight:500;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;min-height:32px}
.tm span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tm .dir{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;padding:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px}
.tm .dir svg{width:20px;height:20px}
.tm.oven{grid-template-columns:1fr 1fr}
.hint{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;line-height:1.45}
.timer-btn{align-self:flex-start;height:48px;padding:0 20px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.cook-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 16px 14px}
.cook-foot button{height:56px;border-radius:999px;font-weight:600;font-size:17px}
.cook-foot .prev{background:var(--soft)}
.cook-foot .next{background:var(--accent);color:var(--accent-ink)}
.cook-foot .prev:disabled{opacity:.4}
.timers{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:16px;display:flex;flex-direction:column;gap:6px;z-index:10;align-items:flex-end}
.pill{height:36px;padding:0 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pill.done{background:var(--warn);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.view{animation:in .28s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.view,.pill.done{animation:none}}
</style>

</head>
<body>
<div id="app"></div>
<div class="timers" id="timers"></div>

<script>
const S={recipes:[],loaded:false,timers:[],audio:null,wake:null};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON={
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  rev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg>',
  dough:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M12 12c-3 0-4.5-2-4.5-4.5C10.5 7.5 12 9.5 12 12zM12 12c3 0 4.5-2 4.5-4.5C13.5 7.5 12 9.5 12 12zM12 17c-3 0-4.5-2-4.5-4.5C10.5 12.5 12 14.5 12 17zM12 17c3 0 4.5-2 4.5-4.5C13.5 12.5 12 14.5 12 17zM12 7.5c-1.4-1-1.4-3 0-4.5 1.4 1.5 1.4 3.5 0 4.5z"/></svg>',
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg>',
  book:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5.5c3-1 6-1 9 1v13c-3-2-6-2-9-1zM21 5.5c-3-1-6-1-9 1v13c3-2 6-2 9-1z"/></svg>',
  search:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  hand:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
};

/* ---------- Mengen ---------- */
const FRAC={0.25:"¼",0.5:"½",0.75:"¾"};
function fmtQty(q,unit){
  if(q==null) return "";
  if(unit==="g"||unit==="ml"){const r=q>=100?Math.round(q/5)*5:Math.round(q);return r+" "+unit}
  const whole=Math.floor(q),rest=Math.round((q-whole)*4)/4;
  const w=rest===1?whole+1:whole,f=rest===1?0:rest;
  const s=(w?w:"")+(f?FRAC[f]:"")||"¼";
  return unit?s+" "+unit:s;
}
function factor(r){return (store.get("por:"+r.id,r.servings))/r.servings}
function ingMap(r){const m={};(r.groups||[]).forEach(g=>g.items.forEach(i=>m[i.id]=i));return m}
function stepHTML(r,text){
  const m=ingMap(r),f=factor(r);
  return esc(text).replace(/\{([\w-]+)\}/g,(_,id)=>{const i=m[id];if(!i)return id;const q=fmtQty(i.qty==null?null:i.qty*f,i.unit);return "<b>"+(q?q.replace(/ /g,"\u00a0")+"\u00a0":"")+esc(i.name)+"</b>"});
}
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const minLabel=m=>m>=60?Math.floor(m/60)+(m%60?":"+String(m%60).padStart(2,"0"):"")+"\u00a0Std.":m+"\u00a0Min.";

/* ---------- Bild (gezeichnet) ---------- */
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}
function paint(cv,r){
  const a=r.art||{},dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||400,h=cv.clientHeight||w;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);const R=rng(r.id||"x");
  // Tisch
  const bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,a.table||"#d9c6a5");bg.addColorStop(1,a.table2||"#b89a72");c.fillStyle=bg;c.fillRect(0,0,w,h);
  c.globalAlpha=.08;c.strokeStyle="#3b2a17";for(let y=0;y<h;y+=7+R()*9){c.lineWidth=.6+R()*1.2;c.beginPath();c.moveTo(0,y);c.bezierCurveTo(w*.3,y+R()*6-3,w*.7,y+R()*6-3,w,y+R()*4-2);c.stroke()}c.globalAlpha=1;
  // Tuch
  c.save();c.translate(w*.08,h*.62);c.rotate(-.18);c.fillStyle=a.cloth||"#eef3ee";c.fillRect(0,0,w*.5,h*.6);c.strokeStyle=a.clothLine||"#8fbf94";c.lineWidth=3;for(let x=10;x<w*.5;x+=16){c.beginPath();c.moveTo(x,0);c.lineTo(x,h*.6);c.stroke()}c.restore();
  const cx=w*.52,cy=h*.47,rad=w*.4;
  // Teller
  c.save();c.shadowColor="rgba(40,25,10,.35)";c.shadowBlur=w*.06;c.shadowOffsetY=w*.02;c.fillStyle="#f6f4ef";c.beginPath();c.arc(cx,cy,rad,0,7);c.fill();c.restore();
  c.strokeStyle="rgba(0,0,0,.06)";c.lineWidth=w*.012;c.beginPath();c.arc(cx,cy,rad*.82,0,7);c.stroke();
  if(a.style==="bowl"){c.fillStyle=a.topping||"#e8a24a";c.beginPath();c.arc(cx,cy,rad*.7,0,7);c.fill();return}
  // Fladen
  c.save();c.translate(cx,cy);c.rotate(-.35);
  const fx=rad*.86,fy=rad*.66;
  c.fillStyle=a.base||"#e2b673";c.beginPath();c.ellipse(0,0,fx,fy,0,0,7);c.fill();
  c.fillStyle=a.topping||"#a8452b";c.beginPath();c.ellipse(0,0,fx*.9,fy*.86,0,0,7);c.fill();
  for(let i=0;i<260;i++){const t=R()*6.283,d=Math.sqrt(R());const x=Math.cos(t)*fx*.88*d,y=Math.sin(t)*fy*.84*d;c.fillStyle=R()<.5?"rgba(70,20,10,.45)":"rgba(220,110,70,.45)";c.beginPath();c.arc(x,y,1+R()*2.6,0,7);c.fill()}
  for(let i=0;i<30;i++){const t=R()*6.283;const x=Math.cos(t)*fx*(.93+R()*.05),y=Math.sin(t)*fy*(.9+R()*.08);c.fillStyle="rgba(120,60,20,.55)";c.beginPath();c.arc(x,y,2+R()*4,0,7);c.fill()}
  c.restore();
  // Petersilie
  for(let i=0;i<34;i++){const t=R()*6.283,d=Math.sqrt(R())*rad*.55;c.fillStyle=R()<.5?"#3f8a35":"#5aa547";c.beginPath();c.ellipse(cx+Math.cos(t)*d,cy+Math.sin(t)*d*.8,3+R()*4,2+R()*2,R()*3,0,7);c.fill()}
  // Zwiebelringe
  c.strokeStyle="rgba(200,120,170,.85)";for(let i=0;i<5;i++){c.lineWidth=2.5;c.beginPath();c.ellipse(cx+(R()-.5)*rad*.8,cy+(R()-.5)*rad*.6,8+R()*8,5+R()*5,R()*3,0,7);c.stroke()}
  // Zitrone
  const lx=cx+rad*.62,ly=cy+rad*.55;c.fillStyle="#f3d34a";c.beginPath();c.arc(lx,ly,rad*.17,Math.PI*.15,Math.PI*1.15);c.fill();c.fillStyle="#fbeaa0";c.beginPath();c.arc(lx,ly,rad*.13,Math.PI*.15,Math.PI*1.15);c.fill();
}
function media(r,style){return r.image?`<img class="photo" src="${esc(r.image)}" alt="${esc(r.title)}" style="${style||""}">`:`<canvas data-r="${r.id}" style="${style||""}"></canvas>`}
function canvases(){document.querySelectorAll("canvas[data-r]").forEach(cv=>{const r=S.recipes.find(x=>x.id===cv.dataset.r);if(r)paint(cv,r)})}

/* ---------- Ansichten ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));const [id,mode]=h.split(".");
  const r=S.recipes.find(x=>x.id===id);
  releaseWake();
  if(r&&mode==="kochen") return cook(r);
  if(r) return detail(r);
  if(id==="rezepte") return list();
  home();
}
const newest=()=>[...S.recipes].sort((a,b)=>(b.order||0)-(a.order||0));
const nav=on=>`<nav class="nav"><div class="nav-in">
  <a href="#" class="${on==="home"?"on":""}" aria-label="Für dich">${ICON.home}Für dich</a>
  <a href="#rezepte" class="${on==="list"?"on":""}" aria-label="Rezepte">${ICON.book}Rezepte</a></div></nav>`;
function home(){
  const rs=newest(),top=rs.slice(0,5),more=rs.slice(0,4);
  $("#app").innerHTML=`<div class="wrap view">
    <div class="top gutter"><h1>Mixküche</h1></div>
    ${!S.loaded?`<div class="empty gutter">Lädt …</div>`:!rs.length?`<div class="empty gutter"><b>Noch keine Rezepte</b>Sag Claude, was du kochen willst. Das Rezept erscheint dann hier.</div>`:`
    <div class="carousel" id="car">${top.map(r=>`
      <button class="hero" onclick="location.hash='${r.id}'">${media(r)}
        <div class="card"><h2>${esc(r.title)}</h2><div class="meta"><span>${minLabel(r.times.total)}</span><span class="dot"></span><span>${esc(r.difficulty||"")}</span></div></div></button>`).join("")}</div>
    ${top.length>1?`<div class="dots" id="dots">${top.map((_,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</div>`:""}
    <div class="gutter"><div class="row-head"><div class="sec-title">Alle Rezepte</div><a class="link" href="#rezepte">Alle ${rs.length}</a></div>
      <div class="grid">${more.map(r=>`
      <button class="tile" onclick="location.hash='${r.id}'">${media(r)}<b>${esc(r.title)}</b><span class="meta">${minLabel(r.times.total)}</span></button>`).join("")}</div></div>`}
    <div class="nav-pad"></div>
  </div>${nav("home")}`;
  const car=$("#car"),dots=$("#dots");
  if(car&&dots)car.addEventListener("scroll",()=>{const k=Math.round(car.scrollLeft/car.clientWidth);dots.querySelectorAll("i").forEach((d,j)=>d.classList.toggle("on",j===k))},{passive:true});
  canvases();scrollTo(0,0);
}

/* ---------- Rezeptliste ---------- */
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss");
const QUICK="Schnell";
function haystack(r){return norm([r.title,r.subtitle,(r.tags||[]).join(" "),...(r.groups||[]).flatMap(g=>g.items.map(i=>i.name))].join(" "))}
function allTags(){const c={};S.recipes.forEach(r=>(r.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));const t=Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,"de"));return S.recipes.some(r=>r.times.total<=45)?[QUICK,...t]:t}
function filtered(){
  const words=norm(S.q).split(/\s+/).filter(Boolean);
  return [...S.recipes].sort((a,b)=>a.title.localeCompare(b.title,"de")).filter(r=>{
    if(S.tag===QUICK&&r.times.total>45)return false;
    if(S.tag&&S.tag!==QUICK&&!(r.tags||[]).includes(S.tag))return false;
    const h=haystack(r);return words.every(w=>h.includes(w));
  });
}
function list(){
  S.q=S.q||"";
  $("#app").innerHTML=`<div class="wrap view gutter">
    <div class="top"><h1>Rezepte</h1></div>
    <div class="search-bar">
      <label class="search">${ICON.search}<input id="q" type="search" placeholder="Rezept oder Zutat suchen" autocomplete="off" enterkeyhint="search" value="${esc(S.q)}">
        <button class="clear ${S.q?"on":""}" id="clr" aria-label="Suche leeren">${ICON.x}</button></label>
      <div class="chips" id="chips"></div>
    </div>
    <div id="res"></div>
  </div>${nav("list")}`;
  const q=$("#q");
  q.addEventListener("input",()=>{S.q=q.value;$("#clr").classList.toggle("on",!!S.q);results()});
  q.addEventListener("keydown",e=>{if(e.key==="Enter")q.blur()});
  $("#clr").addEventListener("click",e=>{e.preventDefault();S.q="";q.value="";$("#clr").classList.remove("on");results();q.focus()});
  chips();results();
}
function chips(){
  const ts=allTags();
  $("#chips").innerHTML=ts.length?[`<button class="chip ${!S.tag?"on":""}" data-t="">Alle</button>`,...ts.map(t=>`<button class="chip ${S.tag===t?"on":""}" data-t="${esc(t)}">${esc(t)}</button>`)].join(""):"";
  $("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S.tag=b.dataset.t||null;$("#chips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));results()};
}
function results(){
  const rs=filtered(),el=$("#res");if(!el)return;
  if(!S.loaded){el.innerHTML=`<div class="empty">Lädt …</div>`;return}
  if(!S.recipes.length){el.innerHTML=`<div class="empty"><b>Noch keine Rezepte</b>Sag Claude, was du kochen willst.</div>`;return}
  if(!rs.length){el.innerHTML=`<div class="empty"><b>Nichts gefunden</b>${S.q?`Kein Rezept passt zu „${esc(S.q)}“.`:"In dieser Kategorie gibt es noch nichts."}<br>Sag Claude Bescheid, dann kommt es rein.</div>`;return}
  el.innerHTML=`<div class="count-line">${rs.length} ${rs.length===1?"Rezept":"Rezepte"}</div><div class="list">${rs.map(r=>`
    <button class="item" onclick="location.hash='${r.id}'">${media(r)}
      <span class="t">${esc(r.title)}<span class="meta"><span>${minLabel(r.times.total)}</span><span class="dot"></span><span>${esc(r.difficulty||"")}</span></span>${(r.tags||[]).length?`<span class="tags">${esc(r.tags.join(" · "))}</span>`:""}</span>
      <span class="chev">${ICON.chev}</span></button>`).join("")}</div>`;
  canvases();
}

function detail(r){
  const por=store.get("por:"+r.id,r.servings),f=por/r.servings;
  $("#app").innerHTML=`<button class="back" aria-label="Zurück" onclick="history.length>1?history.back():location.hash=''">${ICON.back}</button>
  <div class="wrap detail view">${media(r,"display:block;width:100%;aspect-ratio:1/1")}
    <div class="card"><h2>${esc(r.title)}</h2><p class="sub">${esc(r.subtitle||"")}</p>
      <div class="facts"><div><b>${minLabel(r.times.prep)}</b><span>Arbeitszeit</span></div><div><b>${minLabel(r.times.total)}</b><span>Gesamt</span></div><div><b>${esc(r.difficulty)}</b><span>Schwierigkeit</span></div></div>
    </div>
    <div class="gutter">
      <div class="portions"><h3>Zutaten</h3><div class="stepper"><button aria-label="Weniger" onclick="por('${r.id}',-1)">−</button><output>${por} ${esc(r.servingUnit)}</output><button aria-label="Mehr" onclick="por('${r.id}',1)">+</button></div></div>
      ${r.groups.map(g=>`<div class="group">${esc(g.name)}</div>${g.items.map(i=>`<div class="ing"><span class="q">${fmtQty(i.qty==null?null:i.qty*f,i.unit)}</span><span>${esc(i.name)}${i.note?`<small>${esc(i.note)}</small>`:""}</span></div>`).join("")}`).join("")}
      ${r.imageCredit?`<p class="credit">Foto: ${esc(r.imageCredit)}</p>`:""}<div class="spacer"></div>
    </div></div>
  <div class="cta-bar"><button class="cta" onclick="location.hash='${r.id}.kochen'">${store.get("step:"+r.id,0)>0?"Weiterkochen":"Jetzt kochen"}</button></div>`;
  canvases();scrollTo(0,0);
}
window.por=(id,d)=>{const r=S.recipes.find(x=>x.id===id);const v=Math.min(r.maxServings||24,Math.max(1,store.get("por:"+id,r.servings)+d));store.set("por:"+id,v);const y=scrollY;detail(r);scrollTo(0,y)};

function tmPanel(t){
  if(!t) return "";
  const speed=t.mode==="dough"?ICON.dough:esc(t.speed);
  return `<div class="tm">
    <div><b>${t.time!=null?mmss(t.time):"–"}</b><span>Zeit</span></div>
    <div><b>${t.temp!=null?esc(t.temp)+(typeof t.temp==="number"?"°":""):"–"}</b><span>Temperatur</span></div>
    <div><b>${speed}</b><span>${t.mode==="dough"?"Teig":"Stufe"}</span></div>
    ${t.reverse?`<div class="dir">${ICON.rev} Linkslauf</div>`:""}
  </div>`;
}
function ovenPanel(o){return o?`<div class="tm oven"><div><b>${o.temp}°</b><span>Backofen</span></div><div><b style="font-size:17px">${esc(o.mode)}</b><span>Heizart</span></div></div>`:""}
function cook(r){
  let i=Math.min(store.get("step:"+r.id,0),r.steps.length-1);const s=r.steps[i],last=i===r.steps.length-1;
  $("#app").innerHTML=`<div class="cook view" id="cook">
    <div class="cook-head"><button class="x" aria-label="Schließen" onclick="location.hash='${r.id}'">${ICON.x}</button>
      <div class="progress">${r.steps.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><span class="count">${i+1}/${r.steps.length}</span></div>
    <div class="cook-body">
      ${s.group?`<div class="grp">${esc(s.group)}</div>`:""}
      <p class="step-text">${stepHTML(r,s.text)}</p>
      ${tmPanel(s.tm)}${ovenPanel(s.oven)}
      ${s.timer?`<button class="timer-btn" onclick="startTimer('${esc(s.timerLabel||r.title)}',${s.timer})">${ICON.clock} Timer ${mmss(s.timer)}</button>`:""}
      ${s.tip?`<div class="hint">${ICON.hand}<span>${esc(s.tip)}</span></div>`:""}
    </div>
    <div class="cook-foot"><button class="prev" ${i===0?"disabled":""} onclick="go('${r.id}',-1)">Zurück</button>
      <button class="next" onclick="${last?`finish('${r.id}')`:`go('${r.id}',1)`}">${last?"Fertig":"Weiter"}</button></div>
  </div>`;
  const el=$("#cook");let x0=null;
  el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  el.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>70){if(dx<0&&!last)go(r.id,1);if(dx>0&&i>0)go(r.id,-1)}},{passive:true});
  wakeLock();
}
window.go=(id,d)=>{const r=S.recipes.find(x=>x.id===id);store.set("step:"+id,Math.max(0,Math.min(r.steps.length-1,store.get("step:"+id,0)+d)));unlockAudio();cook(r)};
window.finish=id=>{store.set("step:"+id,0);location.hash=id};

/* ---------- Timer ---------- */
function unlockAudio(){try{S.audio=S.audio||new (window.AudioContext||window.webkitAudioContext)();if(S.audio.state==="suspended")S.audio.resume()}catch{}}
function beep(){try{const a=S.audio;if(!a)return;[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.28);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch{}}
window.startTimer=(label,sec)=>{unlockAudio();S.timers.push({id:Date.now(),label,end:Date.now()+sec*1000,rang:false});saveTimers();drawTimers()};
window.stopTimer=id=>{S.timers=S.timers.filter(t=>t.id!==id);saveTimers();drawTimers()};
const saveTimers=()=>store.set("timers",S.timers.map(({id,label,end})=>({id,label,end})));
function drawTimers(){
  const now=Date.now();
  $("#timers").innerHTML=S.timers.map(t=>{const left=(t.end-now)/1000,done=left<=0;
    if(done&&!t.rang){t.rang=true;beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch{}}
    return `<button class="pill ${done?"done":""}" onclick="stopTimer(${t.id})" aria-label="Timer beenden">${ICON.clock}${done?"Fertig · "+esc(t.label):mmss(left)}</button>`}).join("");
}
setInterval(()=>{if(S.timers.length)drawTimers()},1000);

/* ---------- Bildschirm an lassen ---------- */
async function wakeLock(){try{if(!S.wake&&navigator.wakeLock)S.wake=await navigator.wakeLock.request("screen")}catch{}}
function releaseWake(){try{S.wake&&S.wake.release()}catch{}S.wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&location.hash.includes(".kochen")){S.wake=null;wakeLock()}});

/* ---------- Daten ---------- */
S.timers=store.get("timers",[]).map(t=>({...t,rang:t.end<Date.now()}));drawTimers();
addEventListener("hashchange",route);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(canvases,150)});
route();
(async()=>{
  try{
    const res=await fetch("recipes.json",{cache:"no-cache"});
    S.recipes=(await res.json()).sort((a,b)=>(a.order||0)-(b.order||0));
  }catch{}
  S.loaded=true;route();
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body>
</html>
